      :root {
        --bg: #0d1a12;
        --card-bg: #152318;
        --text: #e0ece0;
        --gold: #c9a94e;
        --emerald: #4a9e6b;
        --line: #2d4a32;
        --male: #4a7090;
        --female: #8a5a7a;
        --highlight: #c9a94e;
        --node-size: 60px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        overflow-x: auto;
        min-height: 100vh;
      }

      .tree-header {
        text-align: center;
        padding: 2rem 1rem 1rem;
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(13, 26, 18, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .tree-header h1 {
        font-family: Georgia, serif;
        font-size: 2.2rem;
        background: linear-gradient(180deg, #e8f5e8, #6bc48a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .tree-header p {
        color: #7a9476;
        font-style: italic;
      }

      .tree-controls {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin: 0.5rem 0;
        flex-wrap: wrap;
      }

      .tree-controls button {
        background: var(--card-bg);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 0.5rem 1.2rem;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.3s;
      }

      .tree-controls button:hover {
        border-color: var(--emerald);
        background: #1a2c1e;
      }

      .tree-controls button.active {
        background: var(--emerald);
        color: white;
        border-color: var(--emerald);
      }

      .legend {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin: 0.5rem 0;
        font-size: 0.8rem;
        color: #7a9476;
        flex-wrap: wrap;
      }

      .legend span {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .legend-dot.male {
        background: var(--male);
      }
      .legend-dot.female {
        background: var(--female);
      }
      .legend-dot.covenant {
        background: var(--gold);
      }
      .legend-dot.jesus {
        background: #ffd700;
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
      }

      .tree-container {
        padding: 2rem;
        overflow-x: auto;
        overflow-y: visible;
        display: flex;
        justify-content: center;
        min-width: fit-content;
      }

      .tree-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        padding: 2rem 0;
        min-width: max-content;
      }

      .generation-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: nowrap;
        position: relative;
        min-width: fit-content;
      }

      .generation-label {
        position: absolute;
        left: -180px;
        font-size: 0.75rem;
        color: #7a9476;
        text-align: right;
        width: 160px;
        font-style: italic;
        white-space: nowrap;
      }

      .tree-node {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.3s;
        z-index: 1;
        min-width: 70px;
      }

      .tree-node:hover {
        transform: translateY(-5px);
        z-index: 10;
      }

      .tree-node .node-circle {
        width: var(--node-size);
        height: var(--node-size);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.85rem;
        text-align: center;
        border: 3px solid var(--line);
        background: var(--card-bg);
        color: var(--text);
        transition: all 0.3s;
        position: relative;
      }

      .tree-node .node-circle.male {
        border-color: #5a8aaa;
        background: #1a2a38;
      }
      .tree-node .node-circle.female {
        border-color: #9a6a8a;
        background: #2a1a28;
      }
      .tree-node .node-circle.covenant {
        border-color: var(--gold);
        box-shadow: 0 0 15px rgba(201, 169, 78, 0.4);
        background: #2a2410;
      }
      .tree-node .node-circle.jesus {
        border-color: #ffd700;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
        background: #3a3000;
        font-size: 0.9rem;
      }

      .tree-node:hover .node-circle {
        border-color: var(--emerald);
        box-shadow: 0 0 20px rgba(74, 158, 107, 0.5);
      }

      .tree-node .node-label {
        margin-top: 0.4rem;
        font-size: 0.75rem;
        text-align: center;
        color: #bccdb8;
        max-width: 90px;
        line-height: 1.2;
      }

      .tree-node .node-sub {
        font-size: 0.65rem;
        color: #7a9476;
        text-align: center;
      }

      /* Connecting lines */
      .connector-down {
        width: 2px;
        height: 30px;
        background: var(--line);
        margin: 0 auto;
      }

      .connector-horizontal {
        height: 2px;
        background: var(--line);
        flex: 1;
        min-width: 20px;
        position: relative;
      }

      .connector-group {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .children-row {
        display: flex;
        align-items: flex-start;
        gap: 0;
        position: relative;
      }

      .children-row .connector-horizontal {
        align-self: center;
      }

      .spouse-connector {
        width: 30px;
        height: 2px;
        background: #5a3a5a;
        position: relative;
      }

      .spouse-connector::after {
        content: "💍";
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7rem;
      }

      .section-divider {
        width: 100%;
        max-width: 800px;
        text-align: center;
        padding: 1.5rem;
        margin: 1rem 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .section-divider h3 {
        font-family: Georgia, serif;
        color: var(--gold);
        font-size: 1.2rem;
        letter-spacing: 1px;
      }

      .section-divider p {
        color: #7a9476;
        font-size: 0.8rem;
      }

      /* Tooltip */
      .node-tooltip {
        display: none;
        position: absolute;
        bottom: calc(100% + 15px);
        left: 50%;
        transform: translateX(-50%);
        background: #1a2c1e;
        border: 1px solid var(--emerald);
        border-radius: 10px;
        padding: 0.8rem 1rem;
        font-size: 0.8rem;
        white-space: nowrap;
        z-index: 20;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        color: #e0ece0;
      }

      .node-tooltip strong {
        color: var(--gold);
        display: block;
        margin-bottom: 0.2rem;
      }

      .tree-node:hover .node-tooltip {
        display: block;
      }

      /* Responsive */
      @media (max-width: 900px) {
        .generation-label {
          position: static;
          text-align: center;
          width: auto;
          margin-bottom: 0.5rem;
        }

        .generation-row {
          flex-direction: column;
          align-items: center;
        }

        :root {
          --node-size: 50px;
        }

        .tree-node .node-label {
          font-size: 0.7rem;
          max-width: 70px;
        }

        .tree-header h1 {
          font-size: 1.5rem;
        }
      }

      /* Print */
      @media print {
        body {
          background: white;
          color: black;
        }
        .tree-header {
          position: static;
          background: white;
        }
        .tree-node .node-circle {
          background: white;
          color: black;
        }
      }
    </style>

      // ============ RENDER FAMILY TREE ============
      function renderFamilyTree() {
        const container = document.getElementById("familyTree");
        container.innerHTML = "";

        familyTreeData.sections.forEach((section) => {
          // Section divider
          const divider = document.createElement("div");
          divider.className = "section-divider";
          divider.innerHTML = `<h3>${section.title}</h3><p>${section.subtitle}</p>`;
          container.appendChild(divider);

          // Render each generation
          section.generations.forEach((gen) => {
            // Generation row container
            const genRow = document.createElement("div");
            genRow.className = "generation-row";

            // Label
            if (gen.label) {
              const label = document.createElement("div");
              label.className = "generation-label";
              label.textContent = gen.label;
              genRow.appendChild(label);
            }

            // Parent nodes
            if (gen.nodes && gen.nodes.length > 0) {
              gen.nodes.forEach((node) => {
                const nodeEl = createTreeNode(node);
                genRow.appendChild(nodeEl);

                // Add spouse connector between pairs
                if (gen.nodes.length === 2 && gen.nodes.indexOf(node) === 0) {
                  const spouseConn = document.createElement("div");
                  spouseConn.className = "spouse-connector";
                  genRow.appendChild(spouseConn);
                }
              });
            }

            container.appendChild(genRow);

            // Connector down to children
            if (gen.children && gen.children.length > 0) {
              const connectorDown = document.createElement("div");
              connectorDown.className = "connector-down";
              connectorDown.style.margin = "0 auto";
              container.appendChild(connectorDown);

              // Children row
              const childrenRow = document.createElement("div");
              childrenRow.className = "generation-row";
              childrenRow.style.gap = "1rem";

              gen.children.forEach((child, index) => {
                if (index > 0) {
                  const horizConn = document.createElement("div");
                  horizConn.className = "connector-horizontal";
                  horizConn.style.maxWidth = "20px";
                  childrenRow.appendChild(horizConn);
                }
                const childEl = createTreeNode(child);
                childrenRow.appendChild(childEl);
              });

              container.appendChild(childrenRow);
            }

            // Spacing between generations
            const spacer = document.createElement("div");
            spacer.style.height = "15px";
            container.appendChild(spacer);
          });
        });
      }

      function createTreeNode(data) {
        const node = document.createElement("div");
        node.className = "tree-node";
        node.id = data.id;

        const circle = document.createElement("div");
        circle.className = "node-circle";

        // Determine circle type
        if (data.type === "jesus") {
          circle.classList.add("jesus");
        } else if (data.type === "covenant") {
          circle.classList.add("covenant");
        } else if (data.type === "female") {
          circle.classList.add("female");
        } else {
          circle.classList.add("male");
        }

        // Display name (abbreviated if long)
        let displayName = data.name;
        if (displayName.length > 10) {
          displayName = displayName.substring(0, 9) + "…";
        }
        circle.textContent = displayName;

        node.appendChild(circle);

        // Label
        const label = document.createElement("div");
        label.className = "node-label";
        label.textContent = data.name;
        node.appendChild(label);

        // Sub label
        if (data.sub) {
          const sub = document.createElement("div");
          sub.className = "node-sub";
          sub.textContent = data.sub;
          node.appendChild(sub);
        }

        // Tooltip
        if (data.tooltip) {
          const tooltip = document.createElement("div");
          tooltip.className = "node-tooltip";
          tooltip.innerHTML = `<strong>${data.name}</strong>${data.tooltip}`;
          node.appendChild(tooltip);
        }

        return node;
      }
